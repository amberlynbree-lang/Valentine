    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine Photobooth</title>
  <style>
    body {
      margin: 0;
      background: #ffd6e7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .booth {
      width: 90%;
      max-width: 360px;
      background: #f5f5f5;
      border-radius: 25px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
    }

    .screen {
      width: 100%;
      height: 220px;
      background: #111;
      border-radius: 12px;
      color: #0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      font-size: 18px;
      box-sizing: border-box;
    }

    .screen img {
      width: 100%;
      display: none;
      border-radius: 8px;
    }

    button {
      margin-top: 15px;
      background: #ff4d88;
      border: none;
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
    }

    .slot {
      width: 70%;
      height: 10px;
      background: #333;
      margin: 15px auto;
      border-radius: 5px;
    }

    .print {
      position: absolute;
      bottom: -260px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      transition: 3s ease-out;
    }

    .print.show {
      bottom: -30px;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: float 4s linear forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="booth">
    <div class="screen" id="screen">
      Hiii Zarinn!!<br><br>
      Here's a little surprise for you!!
    </div>

    <button id="startBtn" onclick="startBooth()">Start</button>

    <div class="slot"></div>
    <img id="print" class="print" src="photo.jpg">
  </div>

  <script>
    function startBooth() {
      const screen = document.getElementById("screen");
      const btn = document.getElementById("startBtn");
      btn.style.display = "none";

      let count = 3;
      screen.innerHTML = "Get ready...<br><br>" + count;

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          screen.innerHTML = "Get ready...<br><br>" + count;
        } else {
          clearInterval(interval);
          screen.innerHTML = "Printing your photo...";
          printPhoto();
        }
      }, 1000);
    }

    function printPhoto() {
      const print = document.getElementById("print");
      setTimeout(() => {
        print.classList.add("show");
        createHearts();
      }, 800);
    }

    function createHearts() {
      for (let i = 0; i < 25; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "💗";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
    }
  </script>

</body>
</html>
